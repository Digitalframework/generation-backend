spring.application.name=generation-backend

# Loads DB_PASSWORD (and optional overrides) from a local .env file, see .env.example.
spring.config.import=optional:file:.env[.properties]

# AuthAndSecurity already owns 8080, and two Boot apps cannot both have it.
server.port=${SERVER_PORT:8081}

# --- Who the caller is ---------------------------------------------------------
# Sign-in happens in AuthAndSecurity; this service only verifies the token that
# comes out of it. A caller gets one from GET http://localhost:8080/api/token while
# holding that application's session cookie, then sends it here as
#   Authorization: Bearer <token>
#
# jwk-set-uri is where the public key is fetched from — once, then cached, and
# re-fetched when a token names a key id that is not in the cache, which is what
# makes rotating the key over there need no change here.
#
# issuer-uri alongside it does NOT trigger OIDC discovery (jwk-set-uri wins for
# that); it only adds the check that iss matches. Both values must equal
# app.jwt.issuer in AuthAndSecurity exactly, trailing slash and all.
#
# audiences rejects a token minted for somewhere else, so a second service's token
# cannot be replayed here. Must equal app.jwt.audience over there.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_BASE_URL:http://localhost:8080}/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_BASE_URL:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.audiences=generation-backend

# Origins the browser app is served from. Comma-separated; see SecurityConfig, which
# is where these are applied — Spring Boot has no CORS properties of its own.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# --- Database ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:GenerationServer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Uploads ----------------------------------------------------------------
# A 1024x1024 PNG stays well below this; the limit only stops runaway uploads.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=20MB

# --- Swagger UI (http://localhost:8080/swagger-ui.html) ----------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# --- Errors -----------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
